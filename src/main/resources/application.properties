spring.application.name=sunrise-dental-clinic

# MySQL is not reachable in the build/dev environment used to create this project,
# so we fall back to H2 file mode as explicitly permitted by the assignment brief.
# The same JPA code works unchanged against MySQL 8 - see README.md "Database" section
# for the connection properties to switch back.
spring.datasource.url=jdbc:h2:file:./data/sunrise
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
spring.sql.init.data-locations=classpath:db/data-h2.sql
