<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="content" style="max-width: 420px; margin-top: 4rem;">
    <div class="card">
        <h1>Sunrise Dental Clinic</h1>
        <p>Staff login</p>

        <div class="alert-error" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="alert-success" th:if="${param.logout}">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit">Log in</button>
        </form>

        <p style="margin-top:1.5rem;"><a th:href="@{/help}">Need help?</a></p>
    </div>
</main>
</body>
</html>
